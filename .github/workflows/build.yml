name: Build & Push CUPS Container

on:
  schedule:
    # Check for new CUPS version every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "start.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/mmbesar/cups-container

jobs:
  # ── 1. Resolve the current CUPS version in Debian trixie ──────────────────
  get-version:
    name: Resolve CUPS version
    runs-on: ubuntu-latest
    outputs:
      cups_version: ${{ steps.resolve.outputs.cups_version }}
      already_built: ${{ steps.check.outputs.already_built }}

    steps:
      - name: Query CUPS version from Debian trixie
        id: resolve
        run: |
          # Pull the package index for trixie and extract cups version
          CUPS_VERSION=$(docker run --rm debian:trixie-slim \
            sh -c "apt-get update -qq && apt-cache policy cups \
                   | grep Candidate \
                   | awk '{print \$2}'")
          echo "Resolved CUPS version: ${CUPS_VERSION}"
          echo "cups_version=${CUPS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if this version is already published
        id: check
        run: |
          VERSION="${{ steps.resolve.outputs.cups_version }}"
          # Try to pull the manifest; if it succeeds the tag already exists
          if docker manifest inspect "${IMAGE_NAME}:${VERSION}" > /dev/null 2>&1; then
            echo "Tag ${VERSION} already exists — skipping build."
            echo "already_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${VERSION} not found — proceeding with build."
            echo "already_built=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Build & push multi-arch image ──────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: get-version
    if: needs.get-version.outputs.already_built == 'false'

    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/riscv64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize platform name
        id: sanitize
        run: |
          PLATFORM="${{ matrix.platform }}"
          echo "safe=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.sanitize.outputs.safe }}
          cache-to:   type=gha,scope=${{ steps.sanitize.outputs.safe }},mode=max
          build-args: |
            HPLIP_VERSION=3.22.10

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ steps.sanitize.outputs.safe }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── 3. Merge digests → multi-arch manifest ────────────────────────────────
  merge:
    name: Merge manifests & push tags
    runs-on: ubuntu-latest
    needs:
      - get-version
      - build

    steps:
      - name: Download all digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Exact CUPS package version  e.g.  2.4.7-1+b1
            type=raw,value=${{ needs.get-version.outputs.cups_version }}
            # Major.minor only            e.g.  2.4
            type=raw,value=${{ needs.get-version.outputs.cups_version }},enable=true,suffix=,prefix=
            # Rolling latest
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=cups-container
            org.opencontainers.image.description=Self-hosted CUPS print server with HP/HPLIP support
            org.opencontainers.image.url=https://github.com/mmBesar/cups-container
            org.opencontainers.image.source=https://github.com/mmBesar/cups-container
            org.opencontainers.image.licenses=MIT

      - name: Create and push multi-arch manifest
        run: |
          CUPS_VERSION="${{ needs.get-version.outputs.cups_version }}"
          # Build the digest arguments list
          DIGESTS=$(ls /tmp/digests | awk '{print "${{ env.IMAGE_NAME }}@sha256:"$1}')

          # Push version tag
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:${CUPS_VERSION}" \
            --tag "${{ env.IMAGE_NAME }}:latest" \
            $DIGESTS

      - name: Inspect final manifest
        run: |
          docker buildx imagetools inspect \
            "${{ env.IMAGE_NAME }}:${{ needs.get-version.outputs.cups_version }}"
