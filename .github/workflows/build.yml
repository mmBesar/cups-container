name: Build & Push CUPS Container

on:
  schedule:
    # Check for new CUPS version every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "start.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/mmbesar/cups-container

permissions:
  contents: read
  packages: write   # required to push to GHCR

jobs:
  # ── 1. Resolve the current CUPS version in Debian trixie ──────────────────
  get-version:
    name: Resolve CUPS version
    runs-on: ubuntu-latest
    outputs:
      cups_version: ${{ steps.resolve.outputs.cups_version }}
      already_built: ${{ steps.check.outputs.already_built }}

    steps:
      - name: Query CUPS version from Debian trixie
        id: resolve
        run: |
          # Pull the package index for trixie and extract cups version
          CUPS_VERSION=$(docker run --rm debian:trixie-slim \
            sh -c "apt-get update -qq && apt-cache policy cups \
                   | grep Candidate \
                   | awk '{print \$2}'")
          echo "Resolved CUPS version: ${CUPS_VERSION}"
          # Strip Debian backport suffix only (e.g. 2.4.10-3+deb13u2 → 2.4.10-3)
          CUPS_VERSION="${CUPS_VERSION%%+*}"
          echo "cups_version=${CUPS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if this version is already published
        id: check
        run: |
          VERSION="${{ steps.resolve.outputs.cups_version }}"
          # Try to pull the manifest; if it succeeds the tag already exists
          if docker manifest inspect "${IMAGE_NAME}:${VERSION}" > /dev/null 2>&1; then
            echo "Tag ${VERSION} already exists — skipping build."
            echo "already_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${VERSION} not found — proceeding with build."
            echo "already_built=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Build & push — native runners per arch ─────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    needs: get-version
    if: needs.get-version.outputs.already_built == 'false' || github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
          - platform: linux/riscv64
            runs-on: ubuntu-24.04-riscv       # RISE RISC-V native runner (Scaleway EM-RV1)

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # QEMU only needed on amd64 runner as a fallback safety net;
      # arm64 and riscv64 are native so QEMU is a no-op for their own arch.
      - name: Set up QEMU (amd64 runner only)
        if: matrix.platform == 'linux/amd64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize platform name
        id: sanitize
        run: |
          PLATFORM="${{ matrix.platform }}"
          echo "safe=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.sanitize.outputs.safe }}
          cache-to:   type=gha,scope=${{ steps.sanitize.outputs.safe }},mode=max
          build-args: |
            HPLIP_VERSION=3.22.10

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ steps.sanitize.outputs.safe }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── 3. Merge digests → multi-arch manifest ────────────────────────────────
  merge:
    name: Merge manifests & push tags
    runs-on: ubuntu-latest
    needs:
      - get-version
      - build

    steps:
      - name: Download all digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          CUPS_VERSION="${{ needs.get-version.outputs.cups_version }}"

          # Build --amend arguments from each digest file
          AMEND_ARGS=()
          for digest_file in /tmp/digests/*; do
            digest=$(basename "$digest_file")
            AMEND_ARGS+=(--amend "${{ env.IMAGE_NAME }}@sha256:${digest}")
          done

          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:${CUPS_VERSION}" \
            --tag "${{ env.IMAGE_NAME }}:latest" \
            "${AMEND_ARGS[@]}"

      - name: Inspect final manifest
        run: |
          docker buildx imagetools inspect \
            "${{ env.IMAGE_NAME }}:${{ needs.get-version.outputs.cups_version }}"
